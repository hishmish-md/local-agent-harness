<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run ledger · Local Agent Harness</title>
<style>
:root{--ink:#152639;--paper:#f4eddb;--gold:#f5bf49;--cyan:#83dfdf;--rule:#afa996;--mono:Consolas,'Courier New',monospace;--serif:Georgia,serif}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font:16px/1.45 'Segoe UI',sans-serif}header,main,footer{padding-inline:clamp(20px,4vw,75px)}header{position:sticky;top:0;background:var(--ink);z-index:3;min-height:68px;border-bottom:1px solid #506071;display:flex;align-items:center;gap:14px}header strong{font: bold 21px var(--serif)}header b{color:var(--cyan);font:26px var(--mono)}#stop{margin-left:auto;border:1px solid var(--gold);color:var(--gold);background:var(--ink)}button,input,select{font:inherit;padding:8px 12px}button{cursor:pointer;background:none;color:inherit;border:1px solid currentColor;font-weight:600}button:hover:enabled{box-shadow:inset 0 -3px currentColor}button:disabled{opacity:.55;cursor:default} :focus-visible{outline:3px solid #dd7900;outline-offset:3px}main{padding-block:30px}.kicker,small,dt,.index,footer{font:12px/1.5 var(--mono);letter-spacing:.09em;text-transform:uppercase}.kicker{color:var(--cyan)}h1{font:normal clamp(44px,5vw,78px)/1 var(--serif);letter-spacing:-.055em;margin:10px 0 22px}.mast{display:flex;align-items:end;justify-content:space-between;gap:16px}.mast p{color:var(--cyan);font:14px var(--mono)}.work{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(240px,1fr);align-items:start;gap:clamp(24px,4vw,68px)}article{background:var(--paper);color:var(--ink);padding:clamp(18px,3vw,44px);border-top:6px solid var(--gold)}.folio,.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.folio{border-bottom:3px double var(--ink);padding-bottom:10px}h2{font:normal 36px/1.1 var(--serif);letter-spacing:-.04em;margin:20px 0 12px}.strip{display:flex;gap:4px;height:10px;margin:20px 0 8px}.strip i{flex:1;background:#aba896}.strip .now{background:#b87c04}.strip .done{background:#257175}ol{padding:0;margin:0;list-style:none}li{display:grid;grid-template-columns:30px 1fr auto;gap:14px;align-items:center;border-bottom:1px solid var(--rule);padding:16px 0}.index{border-right:1px solid var(--rule);align-self:stretch;padding-top:3px}li strong{font:normal 22px var(--serif)}li small{display:block;font-size:11px}li em{font:12px var(--mono);text-align:right}.tools{justify-content:flex-start;margin-top:20px}.primary{background:var(--gold);color:var(--ink);border-color:var(--gold)}aside{border-top:1px solid var(--cyan);padding-top:14px}aside h2{font-size:30px}aside p{color:#c9d5d9}fieldset{border:0;padding:0;margin:15px 0}label{display:block;margin:10px 0}input[type=number]{width:90px}footer{border-top:1px solid #506071;padding-block:14px;color:#b7c6cd}.note{border-top:1px solid #526174;margin-top:28px;padding-top:12px}summary{cursor:pointer} [hidden]{display:none!important}@media(max-width:730px){.work{grid-template-columns:1fr}.mast{display:block}.mast p{margin-top:0}header strong{font-size:16px}li{gap:6px}li strong{font-size:18px}header{gap:7px}}
</style><header><b aria-hidden="true">≋</b><strong>Local Agent Harness</strong><button id="stop">■ Stop <small>Esc</small></button></header>
<main><div class="kicker">Operator desk &nbsp;/&nbsp; Edition B</div><div class="mast"><h1>Run ledger</h1><p>● Local simulation</p></div><div class="work"><article><div class="folio"><small>Sequence manuscript</small><small>Folio 01</small></div><h2>Prepare a dispatch</h2><div id="strip" class="strip" aria-hidden="true"></div><small>Execution order →</small><ol id="rows"></ol><div class="tools"><button class="primary" id="run">▶ Play sequence</button><button id="rec">● Record</button><button id="sample" hidden>Capture sample click</button></div></article>
<aside><div class="kicker">Margin notes / live</div><div role="status"><h2 id="state"></h2><p id="msg"></p></div><form id="edit" hidden><label>Wait duration (seconds)<br><input id="secs" type="number" min="1" max="60" step="1" required></label><button>Apply wait</button> <button id="cancel" type="button">Cancel</button></form><form id="choice" hidden><fieldset><legend>Which dispatch tray?</legend><label><input type="radio" name="tray" value="Editorial" required> Editorial</label><label><input type="radio" name="tray" value="Production"> Production</label></fieldset><button>Confirm and continue</button></form><details class="note"><summary>Simulation settings</summary><label><input id="silent" type="checkbox"> Withhold Stop acknowledgment</label><button id="ack" hidden>Deliver acknowledgment</button></details></aside></div></main><footer>Field edition &nbsp;·&nbsp; Synthetic events only &nbsp;·&nbsp; No desktop capture</footer>
<script>
// Editable fixture, playback clock and presentation. Everything runs in this page.
const $=id=>document.getElementById(id), steps=['Open dispatch sheet','Wait for the sheet','Choose dispatch tray','File dispatch'];let mode='Ready',at=-1,wait=3,timer,reply='',completed=0,editing=false;
const active=()=>['Playing','Waiting','Clarification','Recording'].includes(mode);const locked=()=>active()||mode==='Stop requested';
function draw(message){$('state').textContent=mode;$('msg').textContent=message;$('rows').replaceChildren();$('strip').replaceChildren();steps.forEach((title,i)=>{let row=document.createElement('li'),tag=i<completed?'Done':i===at&&active()?'Current':'Queued';if(['Stop requested','Stopped'].includes(mode)&&tag!=='Done')tag='Blocked';if(!locked()&&mode==='Ready')tag='Planned';row.innerHTML=`<span class="index">${String(i+1).padStart(2,'0')}</span><div><small>${['Navigate','Timing','Decision','Action'][i]||'Recorded input'}</small><strong></strong></div><em></em>`;row.querySelector('strong').textContent=title;row.lastChild.textContent=tag;if(i===1){row.children[1].querySelector('strong').append(` · ${wait}s`);if(!locked()){let b=document.createElement('button');b.textContent='Edit wait';b.id='editWait';b.onclick=()=>{editing=true;draw('Change the delay before the decision.');$('secs').value=wait;$('secs').focus()};row.lastChild.replaceChildren(b)}}row.children[1].querySelector('strong').append(i===2&&reply?' · '+reply:'');$('rows').append(row);let bar=document.createElement('i');bar.className=i<completed?'done':i===at?'now':'';$('strip').append(bar)});$('run').disabled=locked()||editing;$('rec').disabled=(locked()&&mode!=='Recording')||editing;$('rec').textContent=mode==='Recording'?'Finish recording':'● Record';$('sample').hidden=mode!=='Recording';$('stop').disabled=!active();$('edit').hidden=!editing;$('choice').hidden=mode!=='Clarification';$('ack').hidden=mode!=='Stop requested'||!$('silent').checked}
function advance(){completed=++at;if(at===steps.length){mode='Complete';draw('Every step finished. Play again to start a new run.');$('run').focus();return}mode=at===1?'Waiting':at===2?'Clarification':'Playing';draw(at===2?'Two trays match. Nothing will be filed until you choose.':at===1?`Holding for ${wait} seconds. Stop cancels the remaining sequence.`:steps[at]+'.');if(at===2){$('choice').querySelector('input').focus();return}timer=setTimeout(advance,at===1?wait*1000:700)}
$('run').onclick=()=>{at=-1;reply='';$('choice').reset();advance();$('stop').focus()};$('rec').onclick=()=>{if(mode==='Recording'){mode='Ready';draw('Recording ended. Captured steps are ready to replay.')}else{mode='Recording';at=-1;completed=0;reply='';draw('Use Capture sample click to append a synthetic input.')}};$('sample').onclick=()=>{steps.push('Click worksheet cell');draw('Sample click appended to the manuscript.')};$('edit').onsubmit=e=>{e.preventDefault();wait=Number($('secs').value);editing=false;draw('Wait updated for the next playback.');$('editWait').focus()};$('cancel').onclick=()=>{editing=false;draw('Wait unchanged.');$('editWait').focus()};$('choice').onsubmit=e=>{e.preventDefault();if(mode!=='Clarification')return;reply=new FormData(e.target).get('tray');advance();$('stop').focus()};function acknowledge(){clearTimeout(timer);mode='Stopped';draw('Stop acknowledged. No queued step will run.');$('run').focus()}function stopNow(){if(!active())return;clearTimeout(timer);mode='Stop requested';draw('Queue blocked immediately. Final executor status is unconfirmed.');if(!$('silent').checked)timer=setTimeout(acknowledge,850);else $('ack').focus()}$('stop').onclick=stopNow;$('ack').onclick=acknowledge;$('silent').onchange=()=>{if(mode==='Stop requested'){clearTimeout(timer);draw('Queue remains blocked pending acknowledgment.');if(!$('silent').checked)timer=setTimeout(acknowledge,850)}};document.onkeydown=e=>{if(e.key==='Escape'){if(editing)$('cancel').click();else stopNow()}};draw('Review the sequence, adjust its timing, or record another step.');
</script></html>
