<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype boards · Local agent harness</title>
<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:#151b19;color:#eff5f1;font:15px 'Segoe UI',Arial,sans-serif}header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 24px;padding:8px clamp(8px,2vw,28px);background:#202824;border-bottom:1px solid #405047}h1{font-size:16px;margin:0}nav{display:flex;flex-wrap:wrap}button,select{min-height:44px;font:inherit;color:inherit;cursor:pointer}button{background:none;border:0;border-bottom:2px solid transparent;padding:0 12px}button[aria-selected=true]{border-color:#8ad7b8;color:#b1efd5}button:hover{background:#304038}label{margin-left:auto;font-size:14px}select{margin-left:6px;background:#29352f;border:1px solid #57695e;border-radius:4px;padding:0 8px}:focus-visible{outline:2px solid #b1efd5;outline-offset:-2px}main{flex:1;min-height:0;overflow:auto;padding:16px}img{display:block;margin:0 auto;height:auto}p{color:#ffd9aa}
</style><header><h1>Prototype boards</h1><nav role="tablist" aria-label="Boards"><button role="tab" id="employee" aria-controls="canvas">Employee</button><button role="tab" id="admin" aria-controls="canvas">Admin</button><button role="tab" id="record-replay" aria-controls="canvas">Record / Replay</button></nav><label>Zoom<select id="zoom"><option value="fit">Fit width</option><option value="all">Fit board</option><option>50%</option><option>75%</option><option>100%</option><option>150%</option><option>200%</option></select></label></header><main id="canvas" role="tabpanel" tabindex="0"><p hidden role="status"></p><img alt="Employee prototype board"></main>
<script>
const tabs=[...document.querySelectorAll('[role=tab]')], canvas=document.querySelector('main'), img=document.querySelector('img'), zoom=document.querySelector('select'), error=document.querySelector('p');
function scale(){if(!img.naturalWidth)return;let w=canvas.clientWidth-32;if(zoom.value==='all')w=Math.min(w,(canvas.clientHeight-32)*img.naturalWidth/img.naturalHeight);else if(zoom.value!=='fit')w=img.naturalWidth*parseFloat(zoom.value)/100;img.style.width=Math.max(1,w)+'px'}
function show(tab){for(const t of tabs){t.setAttribute('aria-selected',String(t===tab));t.tabIndex=t===tab?0:-1}canvas.setAttribute('aria-labelledby',tab.id);error.hidden=true;img.alt=tab.textContent+' prototype board';img.src=tab.id+'.svg';canvas.scrollTo(0,0)}
tabs.forEach((t,i)=>{t.onclick=()=>show(t);t.onkeydown=e=>{const n={ArrowLeft:(i+2)%3,ArrowRight:(i+1)%3,Home:0,End:2}[e.key];if(n!==undefined){e.preventDefault();tabs[n].focus();show(tabs[n])}}});img.onload=scale;img.onerror=()=>{error.textContent='Could not open '+img.getAttribute('src')+'. Keep the SVG beside this file.';error.hidden=false};zoom.onchange=scale;new ResizeObserver(scale).observe(canvas);show(tabs[0]);
</script></html>
