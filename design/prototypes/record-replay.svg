<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Record and replay</title>
  <desc id="desc">Consent covers clicks and navigation in the Project notes window for this session. Keyboard input and other windows are excluded. Step two, a 30-second wait, is selected.</desc>
  <style>text{font-family:Segoe UI,Arial,sans-serif} text[font-size="12"]{letter-spacing:1px} #step-2 text{font-variant-numeric:tabular-nums}</style>
  <rect x="0" y="0" width="1120" height="690" rx="0" fill="#101416" stroke="none" />
  <text x="32" y="37" fill="#65DBBF"  font-size="12" font-weight="700">LOCAL AGENT   /   WORKSPACE</text>
  <text x="32" y="87" fill="#EFF5F3"  font-size="39" font-weight="700">Record &amp; replay</text>
  <text x="32" y="119" fill="#AFBFBA"  font-size="17" font-weight="400">Choose what to capture, then review each step before running it.</text>
  <g id="01-consent">
    <rect x="32" y="149" width="372" height="506" rx="12" fill="#192023" stroke="#526660" />
    <text x="55" y="185" fill="#65DBBF"  font-size="12" font-weight="700">01   /   PERMISSION</text>
    <text x="55" y="224" fill="#EFF5F3"  font-size="26" font-weight="700">Recording scope</text>
    <text x="55" y="257" fill="#AFBFBA"  font-size="15" font-weight="400">One window, for this session only.</text>
    <text x="55" y="307" fill="#AFBFBA"  font-size="12" font-weight="700">WINDOW</text>
    <rect x="55" y="321" width="325" height="44" rx="5" fill="#101416" stroke="#526660" />
    <text x="68" y="349" fill="#EFF5F3"  font-size="16" font-weight="600">Files  /  Project notes</text>
    <text x="55" y="406" fill="#AFBFBA"  font-size="12" font-weight="700">CAPTURE</text>
    <rect x="56" y="425" width="19" height="19" rx="4" fill="#65DBBF" stroke="#65DBBF" />
    <text x="86" y="440" fill="#EFF5F3"  font-size="15" font-weight="400">Clicks and navigation</text>
    <text x="374" y="440" text-anchor="end" fill="#65DBBF" font-size="13">Included</text>
    <path d="M60 434 l4 4 l7 -8" fill="none" stroke="#101416" stroke-width="2" />
    <rect x="56" y="463" width="19" height="19" rx="4" fill="#192023" stroke="#526660" />
    <text x="86" y="478" fill="#EFF5F3"  font-size="15" font-weight="400">Keyboard input</text>
    <text x="374" y="478" text-anchor="end" fill="#AFBFBA" font-size="13">Excluded</text>
    <rect x="56" y="501" width="19" height="19" rx="4" fill="#192023" stroke="#526660" />
    <text x="86" y="516" fill="#EFF5F3"  font-size="15" font-weight="400">Other windows</text>
    <text x="374" y="516" text-anchor="end" fill="#AFBFBA" font-size="13">Excluded</text>
    <rect x="55" y="554" width="178" height="37" rx="6" fill="#65DBBF" stroke="#65DBBF" />
    <text x="67" y="578" fill="#101416" font-size="14" font-weight="600">Allow &amp; start recording</text>
    <rect x="242" y="554" width="72" height="37" rx="6" fill="#192023" stroke="#526660" />
    <text x="254" y="578" fill="#EFF5F3"  font-size="14" font-weight="600">Cancel</text>
    <text x="55" y="622" fill="#AFBFBA"  font-size="14" font-weight="400">Nothing is captured until you allow it.</text>
  </g>
  <g id="02-sequence-editor">
    <rect x="422" y="149" width="666" height="506" rx="12" fill="#192023" stroke="#526660" />
    <text x="446" y="185" fill="#65DBBF"  font-size="12" font-weight="700">02   /   SEQUENCE EDITOR</text>
    <text x="446" y="224" fill="#EFF5F3"  font-size="26" font-weight="700">Project notes</text>
    <rect x="935" y="166" width="128" height="31" rx="15" fill="#203C36" stroke="none" />
    <circle cx="953" cy="181" r="4" fill="#65DBBF" />
    <text x="965" y="186" fill="#65DBBF"  font-size="14" font-weight="700">Recording</text>
    <text x="446" y="255" fill="#AFBFBA"  font-size="15" font-weight="400">Clicks and navigation only in Files / Project notes.</text>
    <rect x="446" y="274" width="82" height="37" rx="6" fill="#192023" stroke="#526660" />
    <text x="458" y="298" fill="#EFF5F3"  font-size="14" font-weight="600">Pause</text>
    <rect x="538" y="274" width="76" height="37" rx="6" fill="#192023" stroke="#526660" />
    <text x="550" y="298" fill="#FFA89A"  font-size="14" font-weight="600">Stop</text>
    <text x="885" y="298" fill="#FFA89A"  font-size="15" font-weight="600">Revoke consent</text>
    <rect x="446" y="330" width="617" height="1" rx="0" fill="#526660" stroke="none" />
    <text x="446" y="363" fill="#EFF5F3"  font-size="19" font-weight="700">Recorded steps</text>
    <text x="936" y="362" fill="#65DBBF"  font-size="14" font-weight="700">+  Add step</text>
  </g>
  <g id="step-1">
    <rect x="446" y="381" width="617" height="50" rx="6" fill="#151B1D" stroke="none" />
    <text x="460" y="411" fill="#AFBFBA"  font-size="13" font-weight="700">01</text>
    <text x="501" y="412" fill="#EFF5F3"  font-size="16" font-weight="700">Open folder</text>
    <text x="610" y="412" fill="#AFBFBA"  font-size="14" font-weight="400">Project notes</text>
    <text x="1012" y="412" fill="#65DBBF"  font-size="14" font-weight="700">Edit</text>
  </g>
  <g id="step-2">
    <rect x="446" y="437" width="617" height="50" rx="6" fill="#203C36" stroke="#65DBBF" stroke-width="2" />
    <text x="460" y="467" fill="#AFBFBA"  font-size="13" font-weight="700">02</text>
    <text x="501" y="468" fill="#EFF5F3"  font-size="16" font-weight="700">Wait</text>
    <text x="610" y="468" fill="#AFBFBA"  font-size="14" font-weight="400">Selected · delay before next step</text>
    <rect x="868" y="444" width="92" height="36" rx="4" fill="#192023" stroke="#526660" />
    <text x="881" y="468" fill="#65DBBF"  font-size="15" font-weight="700">30 sec</text>
    <text x="1012" y="468" fill="#65DBBF"  font-size="14" font-weight="700">Edit</text>
  </g>
  <g id="step-3">
    <rect x="446" y="493" width="617" height="50" rx="6" fill="#151B1D" stroke="none" />
    <text x="460" y="523" fill="#AFBFBA"  font-size="13" font-weight="700">03</text>
    <text x="501" y="524" fill="#EFF5F3"  font-size="16" font-weight="700">Select file</text>
    <text x="610" y="524" fill="#AFBFBA"  font-size="14" font-weight="400">Meeting notes.txt</text>
    <text x="1012" y="524" fill="#65DBBF"  font-size="14" font-weight="700">Edit</text>
  </g>
  <g id="control-outcomes">
    <text x="446" y="581" fill="#EFF5F3"  font-size="14" font-weight="700">Pause</text>
    <text x="505" y="581" fill="#AFBFBA"  font-size="14" font-weight="400">Suspend capture; resume when ready.</text>
    <text x="446" y="605" fill="#EFF5F3"  font-size="14" font-weight="700">Stop</text>
    <text x="505" y="605" fill="#AFBFBA"  font-size="14" font-weight="400">End capture and keep the sequence for review.</text>
    <text x="446" y="629" fill="#EFF5F3"  font-size="14" font-weight="700">Revoke</text>
    <text x="505" y="629" fill="#AFBFBA"  font-size="14" font-weight="400">End capture immediately. Recording again requires consent.</text>
  </g>
</svg>